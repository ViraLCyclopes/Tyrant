name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to draft (e.g. v0.2.0); it must match the app version
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the app version
        shell: pwsh
        run: |
          # "0.1.0", " v0.1.0 " and "V0.1.0" all mean v0.1.0; the rest of the run uses that form.
          $tag = 'v' + $env:TAG.Trim().TrimStart('v', 'V')
          $version = (Get-Content studio/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $tag) { throw "Tag '$($env:TAG)' does not match the app version $version: use v$version (or run npm run set-version)." }
          "TAG=$tag" >> $env:GITHUB_ENV

      - name: The updater key must be set up (and goes into the build config)
        shell: pwsh
        run: |
          $key = (Get-Content studio/src-tauri/updater-key.pub -Raw).Trim()
          if (-not $key) { throw "studio/src-tauri/updater-key.pub is empty: run 'npm run updater-key' (docs/making-a-release.md)." }
          # Tauri's CLI signs the Setup and checks it against plugins > updater > pubkey, which tauri.conf.json leaves empty.
          $config = Get-Content studio/src-tauri/tauri.release.conf.json -Raw | ConvertFrom-Json
          $config | Add-Member -NotePropertyName plugins -NotePropertyValue @{ updater = @{ pubkey = $key } } -Force
          $config | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 studio/src-tauri/tauri.ci.conf.json

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Tests
        run: dotnet test Tyrant.slnx

      - name: Studio dependencies and checks
        working-directory: studio
        run: |
          npm ci
          npm run check
          npm test

      - name: Tyrant's core (sidecar)
        working-directory: studio
        run: npm run sidecar

      - name: Build, sign and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: studio
          args: --config src-tauri/tauri.ci.conf.json
          tagName: ${{ env.TAG }}
          releaseName: Tyrant ${{ env.TAG }}
          releaseBody: ''
          releaseDraft: true
          includeUpdaterJson: true

      - name: Framework zip
        shell: pwsh
        run: |
          dotnet run --project cli/Tyrant.Cli -c Release -- game package-framework --out release-assets/framework.zip
          $zip = Get-ChildItem release-assets/framework.zip
          $name = "Tyrant-Framework-$((Select-String -Path game/Tyrant.Framework.Core/ModManifest.cs -Pattern 'Version = "([^"]+)"').Matches[0].Groups[1].Value).zip"
          Rename-Item $zip.FullName $name
          gh release upload "$env:TAG" "release-assets/$name" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Blender add-on zip
        shell: pwsh
        run: |
          dotnet build cli/Tyrant.Cli -c Release
          $name = "Tyrant-Blender-Addon-$($env:TAG.TrimStart('v')).zip"
          Copy-Item cli/Tyrant.Cli/bin/Release/net10.0/blender/tyrant_blender.zip "release-assets/$name"
          gh release upload "$env:TAG" "release-assets/$name" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
