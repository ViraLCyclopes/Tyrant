[package]
name = "tyrant-app"
version = "0.1.0"
description = "Tyrant — modding toolkit for Prehistoric Kingdom"
edition = "2021"

[lib]
name = "tyrant_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
